<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>گفتگو | AYS</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
</head>
<body>

    <header id="mainHeader">
        <div class="header-content">
            <button id="backBtn" class="back-btn"><i class="fas fa-arrow-right"></i></button>
            <span class="logo-header">AYS</span>
        </div>
    </header>

    <main id="chatMain">
        <div class="chat-wrapper">
            
            <!-- هدر چت -->
            <div class="chat-header-fixed">
                <div class="chat-header-content">
                    <h2>💬 گفتگو</h2>
                    <span id="onlineCount" class="online-count">🟢 ۰ نفر آنلاین</span>
                </div>
                <div class="chat-info-box">
                    <i class="fas fa-users"></i>
                    <div class="chat-info-text">
                        <strong>هدف از گفتگو:</strong> همفکری، تبادل نظر و تکمیل ایده‌ها. هر پیام می‌تواند جرقه‌ای برای همکاری باشد.
                    </div>
                </div>
                <div class="chat-rules">
                    <i class="fas fa-info-circle"></i>
                    <span>پیام‌ها پس از ۱۴ روز حذف می‌شوند. با احترام گفتگو کنید.</span>
                </div>
            </div>

            <!-- بخش پیام‌ها (تنها قسمتی که اسکرول می‌خوره) -->
            <div id="chatMessages" class="chat-messages-scroll">
                <!-- پیام‌ها اینجا قرار می‌گیرند -->
            </div>

            <!-- ورودی پیام (همیشه پایین) -->
            <div class="chat-input-fixed">
                <div class="chat-input-wrapper">
                    <input type="text" id="chatInput" placeholder="پیام خود را بنویسید..." />
                    <button id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

        </div>
    </main>

    <script>
        const API_BASE_URL = 'https://ays-server.onrender.com/api';
        const token = localStorage.getItem('ays_token');
        const currentUserId = localStorage.getItem('ays_user_id');
        const pusherKey = 'c001529546705bdb1a57';
        const pusherCluster = 'eu';

        if (!token) {
            window.location.href = '/';
        }

        // ===== فعال کردن آیتم منوی گفتگو =====
        document.addEventListener('DOMContentLoaded', function() {
            // در صفحه جداگانه، آیتم گفتگو رو فعال می‌کنیم
            localStorage.setItem('activeNav', 'chatPage');
        });
    </script>
    <script src="js/chat.js"></script>
</body>
</html>
